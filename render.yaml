services:
  - type: web
    name: audit-rag-api
    env: python
    rootDir: audit_rag
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn audit_rag.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: src
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
