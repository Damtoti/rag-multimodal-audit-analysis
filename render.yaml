services:
  - type: web
    name: audit-rag-api
    env: docker
    rootDir: audit_rag
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_IMAGE_EXTRACTION
        value: "true"
